# PVE-Advanced-Tools Nginx 反向代理配置
# 放到 /etc/nginx/sites-available/pve-advanced-tools，然后 ln -s 到 sites-enabled

# HTTP → HTTPS 强制跳转
server {
    listen 80;
    server_name pve-advanced-tools.example.com;  # 改成你的域名

    # Let's Encrypt 验证
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其他全部跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主配置
server {
    listen 443 ssl http2;
    server_name pve-advanced-tools.example.com;  # 改成你的域名

    # SSL 证书（Let's Encrypt）
    ssl_certificate     /etc/letsencrypt/live/pve-advanced-tools.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pve-advanced-tools.example.com/privkey.pem;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全头
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 反向代理到 PVE-Advanced-Tools
    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持（如需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 限制请求大小
    client_max_body_size 10m;

    # 日志
    access_log /var/log/nginx/pve-advanced-tools-access.log;
    error_log /var/log/nginx/pve-advanced-tools-error.log;
}
