name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
      - name: Upload static
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-static
          path: backend/static/

  build-linux-x86_64:
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Download static
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-static
          path: backend/static/
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Build
        run: |
          cd backend
          cargo build --release --target x86_64-unknown-linux-gnu
      - name: Rename
        run: cp backend/target/x86_64-unknown-linux-gnu/release/pve-advanced-tools-backend pve-advanced-tools-linux-x86_64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pve-advanced-tools-linux-x86_64
          path: pve-advanced-tools-linux-x86_64

  build-linux-aarch64:
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Download static
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-static
          path: backend/static/
      - name: Build
        run: |
          cd backend
          cross build --release --target aarch64-unknown-linux-gnu
      - name: Rename
        run: cp backend/target/aarch64-unknown-linux-gnu/release/pve-advanced-tools-backend pve-advanced-tools-linux-aarch64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pve-advanced-tools-linux-aarch64
          path: pve-advanced-tools-linux-aarch64

  build-macos:
    needs: build-frontend
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: aarch64-apple-darwin
      - name: Download static
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-static
          path: backend/static/
      - name: Build
        run: |
          cd backend
          cargo build --release --target aarch64-apple-darwin
      - name: Rename
        run: cp backend/target/aarch64-apple-darwin/release/pve-advanced-tools-backend pve-advanced-tools-macos-aarch64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pve-advanced-tools-macos-aarch64
          path: pve-advanced-tools-macos-aarch64

  release:
    needs: [build-linux-x86_64, build-linux-aarch64, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Stage binaries and SHA256SUMS
        run: |
          mkdir -p out
          cp artifacts/pve-advanced-tools-linux-x86_64/pve-advanced-tools-linux-x86_64 out/
          cp artifacts/pve-advanced-tools-linux-aarch64/pve-advanced-tools-linux-aarch64 out/
          cp artifacts/pve-advanced-tools-macos-aarch64/pve-advanced-tools-macos-aarch64 out/
          cd out && sha256sum pve-advanced-tools-* > SHA256SUMS
      # 可选 ed25519 签名：仓库 Secrets 配置 UPDATE_SIGN_KEY（hex 私钥）后，发布自动附 .sig；
      # 平台端配置对应公钥 UPDATE_SIGN_PUBKEY 后即强制验签（未配置则拒绝在线更新，失败关闭）。
      # 私钥经 env 传入（不做脚本插值），仅在 secret 非空时执行。
      - name: Sign binaries (optional)
        env:
          UPDATE_SIGN_KEY: ${{ secrets.UPDATE_SIGN_KEY }}
        run: |
          if [ -z "$UPDATE_SIGN_KEY" ]; then echo "未配置签名私钥，跳过"; exit 0; fi
          cd out
          pip install --quiet pynacl
          UPDATE_SIGN_KEY="$UPDATE_SIGN_KEY" python3 - <<'PYEOF'
          import glob, os
          from nacl.signing import SigningKey
          key = SigningKey(bytes.fromhex(os.environ["UPDATE_SIGN_KEY"].strip()))
          for f in glob.glob("pve-advanced-tools-*"):
              sig = key.sign(open(f, "rb").read()).signature
              open(f + ".sig", "wb").write(sig)
              print("signed", f)
          PYEOF
      - name: Create or update Release
        uses: softprops/action-gh-release@26994186c0ac3ef5cae75ac16aa32e8153525f77 # v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: out/*
